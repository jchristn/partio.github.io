<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#4f46e5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#8888c0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- faint technical grid -->
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- soft nebula glows -->
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>

  <!-- constellation mesh -->
  <g stroke="url(#line)" stroke-width="1">
    <path d="M120 220 L360 340 L300 600 L560 720 L780 560 L1040 660"/>
    <path d="M360 340 L620 260 L780 560"/>
    <path d="M620 260 L900 180 L1180 300 L1360 200"/>
    <path d="M900 180 L1040 660 L1300 760"/>
    <path d="M1180 300 L1360 540 L1300 760"/>
    <path d="M300 600 L120 820"/>
  </g>
  <g fill="#a5b4fc" fill-opacity="0.65">
    <circle cx="120" cy="220" r="3"/>
    <circle cx="360" cy="340" r="3.5"/>
    <circle cx="300" cy="600" r="3"/>
    <circle cx="560" cy="720" r="3.5"/>
    <circle cx="780" cy="560" r="4"/>
    <circle cx="620" cy="260" r="3"/>
    <circle cx="900" cy="180" r="4.5"/>
    <circle cx="1040" cy="660" r="3.5"/>
    <circle cx="1180" cy="300" r="3"/>
    <circle cx="1360" cy="200" r="3"/>
    <circle cx="1360" cy="540" r="3.5"/>
    <circle cx="1300" cy="760" r="3"/>
    <circle cx="120" cy="820" r="2.5"/>
  </g>
  <g fill="#67e8f9" fill-opacity="0.5">
    <circle cx="480" cy="180" r="2"/>
    <circle cx="720" cy="860" r="2"/>
    <circle cx="1120" cy="820" r="2"/>
    <circle cx="1440" cy="380" r="2"/>
    <circle cx="220" cy="460" r="2"/>
    <circle cx="980" cy="440" r="2"/>
  </g>
</svg>
